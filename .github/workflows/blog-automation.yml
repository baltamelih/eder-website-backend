name: Blog Automation (Generate -> Sync to Sanity)

on:
  schedule:
    - cron: "0 6 * * *"    # 09:00 TR (UTC+3)
    - cron: "0 18 * * *"   # 21:00 TR (UTC+3)
  workflow_dispatch:
    inputs:
      retry_slugs:
        description: "Comma-separated slugs to retry regardless of Sheet status"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: blog-automation
  cancel-in-progress: false

jobs:
  generate_sync_finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r content_pipeline/requirements.txt

      - name: Generate posts + enforce quality gates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GSERVICE_ACCOUNT_JSON: ${{ secrets.GSERVICE_ACCOUNT_JSON }}
          SHEET_WORKSHEET: "Sheet1"
          MAX_POSTS_PER_RUN: "3"
          RETRY_SLUGS: ${{ inputs.retry_slugs }}
        run: |
          python content_pipeline/generate_posts.py

      - name: Show current run manifest
        if: always()
        run: |
          cat content_pipeline/run_manifest.json || true
          find src/blog/posts -maxdepth 1 -type f -name "*.md" -print | tail -n 20 || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node deps
        run: npm ci

      - name: Sync only current-run MD posts to Sanity
        id: sanity_sync
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
        run: node src/lib/sync_md_to_sanity.js

      - name: Finalize published posts + mark DONE (tweet disabled)
        if: always()
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GSERVICE_ACCOUNT_JSON: ${{ secrets.GSERVICE_ACCOUNT_JSON }}
          SHEET_WORKSHEET: "Sheet1"
          ENABLE_TWEET: "0"
        run: |
          python content_pipeline/finalize_posts.py

      - name: Upload automation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-automation-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            content_pipeline/run_manifest.json
            content_pipeline/synced_manifest.json
            content_pipeline/finalize_summary.json
