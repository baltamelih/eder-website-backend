    <script>
      /* EDER_AUTH_ADSENSE_ISOLATION */
      (() => {
        const path = window.location.pathname.replace(/\/+$/, "") || "/";
        const authOrPrivate = /^(\/login|\/register|\/forgot-password|\/reset-password|\/app)(\/|$)/.test(path);
        if (authOrPrivate) {
          window.__EDER_ADSENSE_SKIPPED_FOR_AUTH__ = true;
          return;
        }
        const script = document.createElement("script");
        script.async = true;
        script.crossOrigin = "anonymous";
        script.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7415512901536849";
        document.head.appendChild(script);
      })();
    </script>
    
<script src="/eder-auth-bootstrap.js?v=03f6h7"></script>
    <script type="module" src="/src/ads/bootstrap.jsx"></script>
  
<script>
  /* EDER_AUTH_HARD_NAVIGATION */
  (() => {
    const isAuthPath = (value) => {
      try {
        const u = new URL(value, window.location.href);
        return u.origin === window.location.origin &&
          /^(\/login|\/register|\/forgot-password|\/reset-password)(\/|$)/.test(u.pathname);
      } catch {
        return false;
      }
    };

    document.addEventListener("click", (event) => {
      const anchor = event.target instanceof Element ? event.target.closest("a[href]") : null;
      if (!anchor || !isAuthPath(anchor.href)) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      window.location.assign(anchor.href);
    }, true);
  })();
</script>

  <body>
    <div id="root"></div>

    <script>
      window.__EDER_BOOT_DIAGNOSTICS__ = [];

      (function () {
        var pushDiagnostic = function (message) {
          var text = String(message || "unknown_boot_error");
          window.__EDER_BOOT_DIAGNOSTICS__.push(text);

          var probe = document.getElementById("eder-boot-diagnostics");
          if (probe) {
            probe.textContent = window.__EDER_BOOT_DIAGNOSTICS__.join("\n");
          }
        };

        window.addEventListener(
          "error",
          function (event) {
            var target = event && event.target;
            var resource =
              target && (target.src || target.href)
                ? "resource_error: " + (target.src || target.href)
                : null;

            pushDiagnostic(
              resource ||
                (event && event.message) ||
                "window_error_without_message"
            );
          },
          true
        );

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;
          pushDiagnostic(
            "unhandled_rejection: " +
              (reason && reason.message ? reason.message : String(reason))
          );
        });

        window.setTimeout(function () {
          var root = document.getElementById("root");

          if (!root || root.childElementCount > 0) {
            return;
          }

          document.documentElement.dataset.ederBootFallback = "visible";

          var entryState =
            document.documentElement.dataset.ederEntry || "not_executed";
          var diagnostics =
            window.__EDER_BOOT_DIAGNOSTICS__.join(" | ") ||
            "no_browser_error_captured";

          root.innerHTML =
            '<main id="eder-runtime-fallback" data-entry-state="' +
            entryState +
            '" data-boot-diagnostics="' +
            diagnostics.replace(/"/g, "&quot;") +
            '" style="min-height:100vh;display:grid;place-items:center;padding:32px 20px;background:#f7f4ef;color:#111827;font-family:Inter,system-ui,sans-serif">' +
            '<section style="width:min(620px,100%);padding:32px;border:1px solid #e7e1d8;border-radius:24px;background:#fff">' +
            '<div style="margin-bottom:12px;color:#d94d00;font-size:13px;font-weight:900;letter-spacing:.08em">EDER / BOOT</div>' +
            '<h1 style="margin:0 0 12px;font-size:30px">Uygulama başlatılamadı.</h1>' +
            '<p style="margin:0;line-height:1.7;color:#475569">Beklenmeyen bir çalışma zamanı sorunu oluştu. Lütfen daha sonra tekrar deneyin.</p>' +
            "</section></main>";
        }, 6500);
      })();
    </script>

    <pre id="eder-boot-diagnostics" hidden></pre>
