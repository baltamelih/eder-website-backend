<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#f7f4ef" />
  <title>Sayfa Bulunamadı | EDER</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f4ef;color:#171614;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(720px,100%);padding:clamp(30px,7vw,64px);border:1px solid #ded7cd;border-radius:30px;background:#fffdf9;box-shadow:0 28px 90px rgba(30,25,18,.08)}
    .eyebrow{color:#d85f19;font-size:12px;font-weight:850;letter-spacing:.15em;text-transform:uppercase}
    h1{margin:18px 0 16px;font-size:clamp(42px,9vw,78px);line-height:.95;letter-spacing:-.055em}
    p{max-width:560px;color:#69645c;font-size:17px;line-height:1.7}
    a{display:inline-block;margin-top:16px;padding:13px 18px;border-radius:999px;background:#171614;color:#fff;text-decoration:none;font-weight:750}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">404 / EDER</div>
    <h1>Bu sayfa burada değil.</h1>
    <p>Adres değişmiş veya bağlantı hatalı olabilir. Ana sayfadan devam edebilir ya da araç değerlemeye geçebilirsiniz.</p>
    <a href="/">Ana sayfaya dön</a>
  </main>
</body>
</html>
